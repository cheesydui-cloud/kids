# kids 面板。只跑 nft-server，不要把 nft-agent 放进这个容器。
# 在仓库根目录执行:
#   docker compose -f docker/panel/compose.yml up -d --build
# 没有源码、只有 Docker 的机器，用 scripts/install-docker-panel.sh。

services:
  kids-panel:
    build:
      context: ../..
      dockerfile: docker/panel/Dockerfile
      args:
        VERSION: dev
    image: kids-panel:local
    container_name: kids-panel
    restart: unless-stopped
    ports:
      # 只绑本机。公网访问走 1Panel 网站反代到 127.0.0.1:7788。
      - "127.0.0.1:7788:7788"
    environment:
      TZ: Asia/Shanghai
      NFT_ADDR: ":7788"
      NFT_DB: /var/lib/nft/panel.db
      # 不要把密码写进 environment，docker inspect 能看到。
      # 需要指定密码时用 scripts/install-docker-panel.sh。
      # 也可以把密码文件放到数据卷的 bootstrap-admin-password（权限 600），面板读完会删除。
    volumes:
      # panel.db 和 sub_token.key 必须在同一个目录。删掉这个卷，订阅链接会全部失效。
      - kids-data:/var/lib/nft
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kids-data:
