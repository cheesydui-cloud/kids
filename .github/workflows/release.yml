name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        run: |
          chmod +x scripts/release-notes.sh
          scripts/release-notes.sh "${{ steps.ver.outputs.version }}" > release-notes.md
          echo "===== Release notes ====="
          cat release-notes.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          LDFLAGS="-s -w -X nft/internal/server.buildVersion=$VERSION"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" \
              -o dist/nft-agent-linux-$arch ./cmd/nft-agent
          done
          # Pack both agents into nft-server so nodes install from the panel,
          # never GitHub. Placeholders in git stay tiny for tests.
          cp dist/nft-agent-linux-amd64 internal/agentbin/linux-amd64
          cp dist/nft-agent-linux-arm64 internal/agentbin/linux-arm64
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/nft-server-linux-$arch ./cmd/nft-server
          done
          # Unsuffixed names keep older install.sh (v0.1.0) working on amd64.
          cp dist/nft-server-linux-amd64 dist/nft-server
          cp dist/nft-agent-linux-amd64 dist/nft-agent
          (cd dist && sha256sum nft-server nft-agent nft-server-linux-amd64 nft-agent-linux-amd64 nft-server-linux-arm64 nft-agent-linux-arm64 > SHA256SUMS)
          cp install.sh CHANGELOG.md dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/nft-server
            dist/nft-agent
            dist/nft-server-linux-amd64
            dist/nft-agent-linux-amd64
            dist/nft-server-linux-arm64
            dist/nft-agent-linux-arm64
            dist/SHA256SUMS
            dist/install.sh
            dist/CHANGELOG.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
