<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>nft</title>
    <script>
      // Apply the theme before first paint so the page never flashes light.
      (function () {
        var t = localStorage.getItem('nf-theme')
        var dark = t === 'dark' || (t == null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var s = localStorage.getItem('nf-skin')
        document.documentElement.setAttribute('data-skin', s === 'porcelain' ? 'porcelain' : 'xuan')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
